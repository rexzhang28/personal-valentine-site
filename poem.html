<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>For You 💖</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card poemCard">
    
    <div class="titleWrap">
      <h1>WOOHOOO!! <span class="emoji">🌹</span></h1>
    </div>

    <div class="poemWrap">
      <p class="poem">
        Roses are red, violets are blue,<br />
        I'm not an artist, but I'm drawn to you!
      </p>
    </div>

    <div class="stats">
      <div class="stat">
        <div id="countdown" class="num">--:--:--</div>
        <div class="label">until Valentine's Day</div>
      </div>
      <div class="stat">
        <div id="together" class="num">--</div>
        <div class="label">Days together</div>
      </div>
    </div>

    <!-- Make sure your image file name matches (us.jpg / us.png) -->
    <img class="photo" src="us.jpg" alt="A photo of us together" />

    <p class="tiny">Happy Valentine’s Day 💞</p>
    <!-- Decorative floating hearts and roses (poem page) -->
    <div class="decor" aria-hidden="true">
      <span class="floating heart">💖</span>
      <span class="floating heart">💘</span>
      <span class="floating rose">🌹</span>
      <span class="floating heart">❣️</span>
      <span class="floating rose">🌹</span>
      <span class="floating heart">💕</span>
      <span class="floating heart">💓</span>
      <span class="floating rose">🌹</span>
      <span class="floating heart">💝</span>
      <span class="floating heart">💞</span>
      <span class="floating rose">🌹</span>
      <span class="floating heart">❤️</span>
      <span class="floating heart">💘</span>
      <span class="floating rose">🌹</span>
      <span class="floating heart">💕</span>
      <span class="floating rose">🌹</span>
      <span class="floating heart">❣️</span>
      <span class="floating heart">💝</span>
      <span class="floating rose">🌹</span>
      <span class="floating heart">💗</span>
    </div>
  </main>
  <script src="poem.js"></script>
</body>
</html>
