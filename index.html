<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valentine?</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    
    
    <div class="titleWrap">
      <h1>Shreya, will you be my Valentine?</h1>
    </div>


    <div class="playArea" id="playArea">
      <button id="yesBtn" class="btn yes">Yes</button>
      <button id="noBtn" class="btn no">No</button>
    </div>

    <p id="message" class="message" hidden></p>

    <!-- Decorative floating hearts and roses -->
    <div class="decor" aria-hidden="true">
      <span class="floating heart">💖</span>
      <span class="floating heart">💘</span>
      <span class="floating rose">🌹</span>
      <span class="floating heart">❣️</span>
      <span class="floating rose">🌹</span>
      <span class="floating heart">💕</span>
      <span class="floating heart">💓</span>
      <span class="floating rose">🌹</span>
      <span class="floating heart">💝</span>
      <span class="floating heart">💞</span>
      <span class="floating rose">🌹</span>
      <span class="floating heart">❤️</span>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
